<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#120D08"/>
      <stop offset="50%" style="stop-color:#1e1610"/>
      <stop offset="100%" style="stop-color:#120D08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="40%" style="stop-color:#C9A84C"/>
      <stop offset="60%" style="stop-color:#E8C547"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" style="stop-color:#1e1610" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#120D08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Center dark overlay for readability -->
  <ellipse cx="300" cy="192" rx="260" ry="190" fill="url(#centerGlow)"/>

  <!-- Floral burst - top left corner (colorful flowers) -->
  <g transform="translate(-20, -20)" opacity="0.75">
    <!-- Orange flower -->
    <ellipse cx="80" cy="60" rx="18" ry="9" fill="#ff8c42" transform="rotate(30 80 60)"/>
    <ellipse cx="80" cy="60" rx="18" ry="9" fill="#ff8c42" transform="rotate(90 80 60)"/>
    <ellipse cx="80" cy="60" rx="18" ry="9" fill="#ff6b24" transform="rotate(150 80 60)"/>
    <circle cx="80" cy="60" r="7" fill="#ffd166"/>
    <!-- Pink bloom -->
    <ellipse cx="40" cy="100" rx="14" ry="7" fill="#f4a0c0" transform="rotate(45 40 100)"/>
    <ellipse cx="40" cy="100" rx="14" ry="7" fill="#f4a0c0" transform="rotate(105 40 100)"/>
    <ellipse cx="40" cy="100" rx="14" ry="7" fill="#e8729a" transform="rotate(165 40 100)"/>
    <circle cx="40" cy="100" r="5" fill="#fff"/>
    <!-- Blue flower -->
    <ellipse cx="105" cy="35" rx="12" ry="6" fill="#5fb8d4" transform="rotate(20 105 35)"/>
    <ellipse cx="105" cy="35" rx="12" ry="6" fill="#5fb8d4" transform="rotate(80 105 35)"/>
    <ellipse cx="105" cy="35" rx="12" ry="6" fill="#3d9ab8" transform="rotate(140 105 35)"/>
    <circle cx="105" cy="35" r="4.5" fill="#ffdc80"/>
    <!-- Teal leaves -->
    <ellipse cx="55" cy="70" rx="20" ry="7" fill="#1B7A8C" opacity="0.6" transform="rotate(-30 55 70)"/>
    <ellipse cx="90" cy="80" rx="18" ry="6" fill="#1B7A8C" opacity="0.5" transform="rotate(20 90 80)"/>
    <!-- Purple bloom -->
    <ellipse cx="25" cy="45" rx="10" ry="5" fill="#c8a8e9" transform="rotate(60 25 45)"/>
    <ellipse cx="25" cy="45" rx="10" ry="5" fill="#c8a8e9" transform="rotate(120 25 45)"/>
    <circle cx="25" cy="45" r="4" fill="#f9df8a"/>
  </g>

  <!-- Floral burst - top right corner -->
  <g transform="translate(620, -20) scale(-1,1)" opacity="0.75">
    <ellipse cx="80" cy="60" rx="18" ry="9" fill="#ff8c42" transform="rotate(30 80 60)"/>
    <ellipse cx="80" cy="60" rx="18" ry="9" fill="#ff8c42" transform="rotate(90 80 60)"/>
    <ellipse cx="80" cy="60" rx="18" ry="9" fill="#ff6b24" transform="rotate(150 80 60)"/>
    <circle cx="80" cy="60" r="7" fill="#ffd166"/>
    <ellipse cx="40" cy="100" rx="14" ry="7" fill="#f4a0c0" transform="rotate(45 40 100)"/>
    <ellipse cx="40" cy="100" rx="14" ry="7" fill="#f4a0c0" transform="rotate(105 40 100)"/>
    <ellipse cx="40" cy="100" rx="14" ry="7" fill="#e8729a" transform="rotate(165 40 100)"/>
    <circle cx="40" cy="100" r="5" fill="#fff"/>
    <ellipse cx="105" cy="35" rx="12" ry="6" fill="#5fb8d4" transform="rotate(20 105 35)"/>
    <ellipse cx="105" cy="35" rx="12" ry="6" fill="#5fb8d4" transform="rotate(80 105 35)"/>
    <ellipse cx="105" cy="35" rx="12" ry="6" fill="#3d9ab8" transform="rotate(140 105 35)"/>
    <circle cx="105" cy="35" r="4.5" fill="#ffdc80"/>
    <ellipse cx="55" cy="70" rx="20" ry="7" fill="#1B7A8C" opacity="0.6" transform="rotate(-30 55 70)"/>
    <ellipse cx="90" cy="80" rx="18" ry="6" fill="#1B7A8C" opacity="0.5" transform="rotate(20 90 80)"/>
    <ellipse cx="25" cy="45" rx="10" ry="5" fill="#c8a8e9" transform="rotate(60 25 45)"/>
    <ellipse cx="25" cy="45" rx="10" ry="5" fill="#c8a8e9" transform="rotate(120 25 45)"/>
    <circle cx="25" cy="45" r="4" fill="#f9df8a"/>
  </g>

  <!-- Peacock left (simplified SVG) -->
  <g transform="translate(48, 185)" opacity="0.85">
    <!-- Tail feathers -->
    <g opacity="0.7">
      <line x1="36" y1="80" x2="20" y2="20" stroke="#1B7A8C" stroke-width="1.5"/>
      <ellipse cx="19" cy="17" rx="7" ry="9" fill="#1a8fa8" opacity="0.4"/>
      <ellipse cx="19" cy="17" rx="4" ry="5.5" fill="#0d5c70" opacity="0.6"/>
      <circle cx="19" cy="17" r="2.2" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="5" y2="35" stroke="#1B7A8C" stroke-width="1.5"/>
      <ellipse cx="3" cy="32" rx="7" ry="9" fill="#1a8fa8" opacity="0.35"/>
      <circle cx="3" cy="32" r="2" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="-5" y2="55" stroke="#1B7A8C" stroke-width="1.5"/>
      <ellipse cx="-7" cy="52" rx="6" ry="8" fill="#1a8fa8" opacity="0.3"/>
      <circle cx="-7" cy="52" r="1.8" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="35" y2="15" stroke="#1B7A8C" stroke-width="1.2"/>
      <ellipse cx="35" cy="12" rx="6" ry="8" fill="#1a8fa8" opacity="0.35"/>
      <circle cx="35" cy="12" r="2" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="55" y2="20" stroke="#1B7A8C" stroke-width="1.2"/>
      <ellipse cx="57" cy="17" rx="6" ry="8" fill="#1a8fa8" opacity="0.3"/>
      <circle cx="57" cy="17" r="2" fill="#C9A84C"/>
    </g>
    <!-- Body -->
    <ellipse cx="36" cy="110" rx="22" ry="30" fill="#1a6e7e" opacity="0.9"/>
    <ellipse cx="33" cy="115" rx="15" ry="22" fill="#0d4d5a" opacity="0.5"/>
    <!-- Chest -->
    <ellipse cx="36" cy="100" rx="15" ry="20" fill="#29b8d4" opacity="0.7"/>
    <!-- Neck -->
    <path d="M 30 85 Q 26 70 30 56 Q 34 46 36 44 Q 38 46 42 56 Q 46 70 42 85 Z" fill="#1a6e7e"/>
    <!-- Head -->
    <circle cx="36" cy="40" r="13" fill="#1a7a8c"/>
    <circle cx="36" cy="40" r="11" fill="#29b8d4" opacity="0.7"/>
    <!-- Eye -->
    <circle cx="40" cy="37" r="3.5" fill="white"/>
    <circle cx="40.5" cy="37" r="2.5" fill="#08202a"/>
    <circle cx="41.2" cy="36.2" r="0.9" fill="white"/>
    <!-- Beak -->
    <path d="M 36 48 L 30 54 L 36 52 Z" fill="#C9A84C" opacity="0.9"/>
    <!-- Crown -->
    <line x1="30" y1="28" x2="27" y2="14" stroke="#2da8c0" stroke-width="1.2"/>
    <circle cx="27" cy="13" r="2.5" fill="#C9A84C" opacity="0.9"/>
    <line x1="36" y1="27" x2="36" y2="13" stroke="#2da8c0" stroke-width="1.2"/>
    <circle cx="36" cy="12" r="2.5" fill="#C9A84C" opacity="0.9"/>
    <line x1="42" y1="28" x2="45" y2="14" stroke="#2da8c0" stroke-width="1.2"/>
    <circle cx="45" cy="13" r="2.5" fill="#C9A84C" opacity="0.9"/>
  </g>

  <!-- Peacock right (mirrored) -->
  <g transform="translate(552, 185) scale(-1,1)" opacity="0.75">
    <g opacity="0.7">
      <line x1="36" y1="80" x2="20" y2="20" stroke="#1B7A8C" stroke-width="1.5"/>
      <ellipse cx="19" cy="17" rx="7" ry="9" fill="#1a8fa8" opacity="0.4"/>
      <circle cx="19" cy="17" r="2.2" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="5" y2="35" stroke="#1B7A8C" stroke-width="1.5"/>
      <ellipse cx="3" cy="32" rx="7" ry="9" fill="#1a8fa8" opacity="0.35"/>
      <circle cx="3" cy="32" r="2" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="-5" y2="55" stroke="#1B7A8C" stroke-width="1.5"/>
      <ellipse cx="-7" cy="52" rx="6" ry="8" fill="#1a8fa8" opacity="0.3"/>
      <circle cx="-7" cy="52" r="1.8" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="35" y2="15" stroke="#1B7A8C" stroke-width="1.2"/>
      <ellipse cx="35" cy="12" rx="6" ry="8" fill="#1a8fa8" opacity="0.35"/>
      <circle cx="35" cy="12" r="2" fill="#C9A84C"/>
      <line x1="36" y1="80" x2="55" y2="20" stroke="#1B7A8C" stroke-width="1.2"/>
      <ellipse cx="57" cy="17" rx="6" ry="8" fill="#1a8fa8" opacity="0.3"/>
      <circle cx="57" cy="17" r="2" fill="#C9A84C"/>
    </g>
    <ellipse cx="36" cy="110" rx="22" ry="30" fill="#1a6e7e" opacity="0.9"/>
    <ellipse cx="36" cy="100" rx="15" ry="20" fill="#29b8d4" opacity="0.7"/>
    <path d="M 30 85 Q 26 70 30 56 Q 34 46 36 44 Q 38 46 42 56 Q 46 70 42 85 Z" fill="#1a6e7e"/>
    <circle cx="36" cy="40" r="13" fill="#1a7a8c"/>
    <circle cx="36" cy="40" r="11" fill="#29b8d4" opacity="0.7"/>
    <circle cx="40" cy="37" r="3.5" fill="white"/>
    <circle cx="40.5" cy="37" r="2.5" fill="#08202a"/>
    <circle cx="41.2" cy="36.2" r="0.9" fill="white"/>
    <path d="M 36 48 L 30 54 L 36 52 Z" fill="#C9A84C" opacity="0.9"/>
    <line x1="30" y1="28" x2="27" y2="14" stroke="#2da8c0" stroke-width="1.2"/>
    <circle cx="27" cy="13" r="2.5" fill="#C9A84C" opacity="0.9"/>
    <line x1="36" y1="27" x2="36" y2="13" stroke="#2da8c0" stroke-width="1.2"/>
    <circle cx="36" cy="12" r="2.5" fill="#C9A84C" opacity="0.9"/>
    <line x1="42" y1="28" x2="45" y2="14" stroke="#2da8c0" stroke-width="1.2"/>
    <circle cx="45" cy="13" r="2.5" fill="#C9A84C" opacity="0.9"/>
  </g>

  <!-- Gold arch frame in center -->
  <path d="M 170 370 L 170 168 A 130 130 0 0 1 430 168 L 430 370" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>
  <path d="M 178 370 L 178 176 A 122 122 0 0 1 422 176 L 422 370" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.3"/>
  <!-- Arch top ornament -->
  <g transform="translate(300, 40)">
    <polygon points="0,-8 6,0 0,8 -6,0" fill="#C9A84C" opacity="0.9"/>
    <circle cx="-14" cy="0" r="2.5" fill="#C9A84C" opacity="0.5"/>
    <circle cx="14" cy="0" r="2.5" fill="#C9A84C" opacity="0.5"/>
    <line x1="-30" y1="0" x2="-18" y2="0" stroke="#8B6914" stroke-width="0.8" opacity="0.6"/>
    <line x1="18" y1="0" x2="30" y2="0" stroke="#8B6914" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- Arch base line -->
  <line x1="170" y1="370" x2="430" y2="370" stroke="url(#gold)" stroke-width="1.2" opacity="0.5"/>

  <!-- "The Wedding of" label -->
  <text x="300" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" fill="#C9A84C" opacity="0.8" letter-spacing="4" font-style="italic">The Wedding of</text>

  <!-- Divider -->
  <g transform="translate(300,100)">
    <line x1="-60" y1="0" x2="-12" y2="0" stroke="#8B6914" stroke-width="0.7" opacity="0.5"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#C9A84C" opacity="0.7"/>
    <line x1="12" y1="0" x2="60" y2="0" stroke="#8B6914" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- Couple names -->
  <text x="300" y="148" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#E8C547" font-style="italic" font-weight="400" opacity="0.95">Siti</text>
  <text x="300" y="175" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#C9A84C" opacity="0.65" font-style="italic">&amp;</text>
  <text x="300" y="216" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#E8C547" font-style="italic" font-weight="400" opacity="0.95">Ahmad</text>

  <!-- Date divider -->
  <g transform="translate(300,234)">
    <line x1="-80" y1="0" x2="-14" y2="0" stroke="#8B6914" stroke-width="0.7" opacity="0.45"/>
    <ellipse cx="0" cy="-3" rx="6" ry="4" fill="none" stroke="#1B7A8C" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="2" fill="#C9A84C" opacity="0.6"/>
    <line x1="14" y1="0" x2="80" y2="0" stroke="#8B6914" stroke-width="0.7" opacity="0.45"/>
  </g>

  <!-- Date -->
  <text x="300" y="256" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" fill="#C9A84C" opacity="0.75" letter-spacing="2">Sabtu, 14 Februari 2026</text>

  <!-- Location -->
  <text x="300" y="276" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#C9A84C" opacity="0.5" letter-spacing="1">Grand Ballroom, Jakarta</text>

  <!-- Scattered falling petals -->
  <ellipse cx="160" cy="130" rx="6" ry="4" fill="#ff8c42" opacity="0.6" transform="rotate(-30 160 130)"/>
  <ellipse cx="195" cy="85" rx="5" ry="3" fill="#f4a0c0" opacity="0.5" transform="rotate(20 195 85)"/>
  <ellipse cx="410" cy="100" rx="6" ry="4" fill="#5fb8d4" opacity="0.55" transform="rotate(35 410 100)"/>
  <ellipse cx="445" cy="150" rx="5" ry="3" fill="#c8a8e9" opacity="0.5" transform="rotate(-15 445 150)"/>
  <ellipse cx="220" cy="310" rx="5" ry="3" fill="#ff8c42" opacity="0.4" transform="rotate(40 220 310)"/>
  <ellipse cx="380" cy="295" rx="6" ry="4" fill="#f4a0c0" opacity="0.45" transform="rotate(-25 380 295)"/>
  <circle cx="245" cy="180" r="3" fill="#ffd166" opacity="0.4"/>
  <circle cx="355" cy="165" r="2.5" fill="#a8dab5" opacity="0.45"/>

  <!-- Peacock eye motifs (floating) -->
  <g opacity="0.25">
    <ellipse cx="155" cy="225" rx="8" ry="8" fill="none" stroke="#C9A84C" stroke-width="0.7"/>
    <ellipse cx="155" cy="225" rx="4.5" ry="4.5" fill="#1B7A8C" opacity="0.5"/>
    <circle cx="155" cy="225" r="2" fill="#C9A84C"/>
    <ellipse cx="445" cy="220" rx="8" ry="8" fill="none" stroke="#C9A84C" stroke-width="0.7"/>
    <ellipse cx="445" cy="220" rx="4.5" ry="4.5" fill="#1B7A8C" opacity="0.5"/>
    <circle cx="445" cy="220" r="2" fill="#C9A84C"/>
  </g>

  <!-- Bottom flowers (left) -->
  <g transform="translate(0, 270)" opacity="0.7">
    <ellipse cx="30" cy="90" rx="15" ry="8" fill="#5fb8d4" transform="rotate(-20 30 90)"/>
    <ellipse cx="30" cy="90" rx="15" ry="8" fill="#3d9ab8" transform="rotate(40 30 90)"/>
    <ellipse cx="30" cy="90" rx="15" ry="8" fill="#5fb8d4" transform="rotate(100 30 90)"/>
    <circle cx="30" cy="90" r="6" fill="#ffd166"/>
    <ellipse cx="70" cy="108" rx="14" ry="7" fill="#ff9f7f" transform="rotate(15 70 108)"/>
    <ellipse cx="70" cy="108" rx="14" ry="7" fill="#ff7a4f" transform="rotate(75 70 108)"/>
    <circle cx="70" cy="108" r="5" fill="#ffe066"/>
    <ellipse cx="15" cy="70" rx="12" ry="6" fill="#c8a8e9" transform="rotate(-40 15 70)"/>
    <ellipse cx="15" cy="70" rx="12" ry="6" fill="#a880d4" transform="rotate(20 15 70)"/>
    <circle cx="15" cy="70" r="4.5" fill="#fff"/>
    <!-- Leaves -->
    <ellipse cx="45" cy="100" rx="22" ry="8" fill="#1B7A8C" opacity="0.5" transform="rotate(-35 45 100)"/>
    <ellipse cx="10" cy="100" rx="18" ry="7" fill="#1B7A8C" opacity="0.4" transform="rotate(10 10 100)"/>
  </g>

  <!-- Bottom flowers (right) -->
  <g transform="translate(600, 270) scale(-1,1)" opacity="0.7">
    <ellipse cx="30" cy="90" rx="15" ry="8" fill="#5fb8d4" transform="rotate(-20 30 90)"/>
    <ellipse cx="30" cy="90" rx="15" ry="8" fill="#3d9ab8" transform="rotate(40 30 90)"/>
    <ellipse cx="30" cy="90" rx="15" ry="8" fill="#5fb8d4" transform="rotate(100 30 90)"/>
    <circle cx="30" cy="90" r="6" fill="#ffd166"/>
    <ellipse cx="70" cy="108" rx="14" ry="7" fill="#ff9f7f" transform="rotate(15 70 108)"/>
    <ellipse cx="70" cy="108" rx="14" ry="7" fill="#ff7a4f" transform="rotate(75 70 108)"/>
    <circle cx="70" cy="108" r="5" fill="#ffe066"/>
    <ellipse cx="15" cy="70" rx="12" ry="6" fill="#c8a8e9" transform="rotate(-40 15 70)"/>
    <ellipse cx="15" cy="70" rx="12" ry="6" fill="#a880d4" transform="rotate(20 15 70)"/>
    <circle cx="15" cy="70" r="4.5" fill="#fff"/>
    <ellipse cx="45" cy="100" rx="22" ry="8" fill="#1B7A8C" opacity="0.5" transform="rotate(-35 45 100)"/>
    <ellipse cx="10" cy="100" rx="18" ry="7" fill="#1B7A8C" opacity="0.4" transform="rotate(10 10 100)"/>
  </g>

  <!-- Watermark -->
  <text x="300" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#C9A84C" opacity="0.2" letter-spacing="5">NIKAHYUK · BY RATNA OFFSET</text>
</svg>
