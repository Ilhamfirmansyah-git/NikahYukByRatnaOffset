<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background texture -->
  <rect width="600" height="400" fill="#FDF8F2"/>
  <rect width="600" height="400" fill="url(#linen)" opacity="0.4"/>

  <defs>
    <pattern id="linen" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="none"/>
      <line x1="0" y1="0" x2="4" y2="4" stroke="#e8ddd0" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Dark maroon panel top -->
  <rect x="0" y="0" width="600" height="90" fill="#4A0000" opacity="0.92"/>

  <!-- Maroon panel bottom -->
  <rect x="0" y="310" width="600" height="90" fill="#6B0000" opacity="0.88"/>

  <!-- Center card (cream) -->
  <rect x="160" y="60" width="280" height="280" rx="3" fill="#FDF8F2" opacity="0.97"/>
  <rect x="160" y="60" width="280" height="280" rx="3" fill="none" stroke="#6B0000" stroke-width="1" opacity="0.25"/>

  <!-- Inner border -->
  <rect x="170" y="70" width="260" height="260" rx="2" fill="none" stroke="#6B0000" stroke-width="0.5" opacity="0.2"/>

  <!-- Envelope flap top (decorative) -->
  <path d="M160 60 L300 140 L440 60 Z" fill="#6B0000" opacity="0.12"/>

  <!-- Wax seal circle -->
  <circle cx="300" cy="200" r="30" fill="#6B0000" opacity="0.15"/>
  <circle cx="300" cy="200" r="24" fill="#6B0000" opacity="0.2"/>

  <!-- "The Wedding Of" text -->
  <text x="300" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#6B0000" opacity="0.7" letter-spacing="3">THE WEDDING OF</text>

  <!-- Couple names -->
  <text x="300" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#4A0000" font-style="italic">Allesya</text>
  <text x="300" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6B0000" opacity="0.55" letter-spacing="2">&amp;</text>
  <text x="300" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#4A0000" font-style="italic">Robert</text>

  <!-- Date -->
  <line x1="240" y1="238" x2="360" y2="238" stroke="#6B0000" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6B0000" opacity="0.65" letter-spacing="2">12 . 12 . 26</text>

  <!-- Button shape -->
  <rect x="240" y="268" width="120" height="26" rx="1" fill="#6B0000" opacity="0.85"/>
  <text x="300" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#FDF8F2" letter-spacing="2">OPEN INVITATION</text>

  <!-- Decorative corner flowers (simplified) -->
  <circle cx="172" cy="62" r="5" fill="#6B0000" opacity="0.18"/>
  <circle cx="438" cy="62" r="5" fill="#6B0000" opacity="0.18"/>
  <circle cx="172" cy="338" r="5" fill="#6B0000" opacity="0.18"/>
  <circle cx="438" cy="338" r="5" fill="#6B0000" opacity="0.18"/>

  <!-- Top header text -->
  <text x="300" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#FDF8F2" font-style="italic" opacity="0.9">Romantis Maroon</text>
  <text x="300" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#FDF8F2" opacity="0.45" letter-spacing="3">WEDDING INVITATION</text>

  <!-- Bottom footer text -->
  <text x="300" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#FDF8F2" opacity="0.5" letter-spacing="2">RSVP · GALERI · LOKASI</text>
  <text x="300" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#FDF8F2" opacity="0.35" letter-spacing="1">NikahYuk by Ratna Offset</text>
</svg>
