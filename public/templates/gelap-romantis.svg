<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0500"/>
      <stop offset="50%" style="stop-color:#1a0a00"/>
      <stop offset="100%" style="stop-color:#0d0500"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Outer border -->
  <rect x="12" y="12" width="576" height="376" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  <rect x="18" y="18" width="564" height="364" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner ornaments - Top Left -->
  <g transform="translate(20,20)" opacity="0.85">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffd700" opacity="0.8"/>
    <circle cx="30" cy="0" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="30" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <!-- Floral petal -->
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(45 18 18)" opacity="0.5"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(-45 18 18)" opacity="0.5"/>
    <circle cx="18" cy="18" r="3" fill="#ffd700" opacity="0.4"/>
  </g>

  <!-- Corner ornaments - Top Right -->
  <g transform="translate(580,20) scale(-1,1)" opacity="0.85">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffd700" opacity="0.8"/>
    <circle cx="30" cy="0" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="30" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(45 18 18)" opacity="0.5"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(-45 18 18)" opacity="0.5"/>
    <circle cx="18" cy="18" r="3" fill="#ffd700" opacity="0.4"/>
  </g>

  <!-- Corner ornaments - Bottom Left -->
  <g transform="translate(20,380) scale(1,-1)" opacity="0.85">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffd700" opacity="0.8"/>
    <circle cx="30" cy="0" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="30" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(45 18 18)" opacity="0.5"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(-45 18 18)" opacity="0.5"/>
    <circle cx="18" cy="18" r="3" fill="#ffd700" opacity="0.4"/>
  </g>

  <!-- Corner ornaments - Bottom Right -->
  <g transform="translate(580,380) scale(-1,-1)" opacity="0.85">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="60" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ffd700" opacity="0.8"/>
    <circle cx="30" cy="0" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="30" r="2" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.6"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(45 18 18)" opacity="0.5"/>
    <ellipse cx="18" cy="18" rx="12" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" transform="rotate(-45 18 18)" opacity="0.5"/>
    <circle cx="18" cy="18" r="3" fill="#ffd700" opacity="0.4"/>
  </g>

  <!-- Top arabesque divider -->
  <g transform="translate(300,52)" filter="url(#glow)">
    <line x1="-80" y1="0" x2="-20" y2="0" stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
    <line x1="20" y1="0" x2="80" y2="0" stroke="url(#gold)" stroke-width="0.8" opacity="0.7"/>
    <!-- Diamond -->
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#ffd700" opacity="0.9"/>
    <polygon points="0,-3 3,0 0,3 -3,0" fill="#0d0500"/>
    <!-- Small dots -->
    <circle cx="-12" cy="0" r="1.5" fill="#ffd700" opacity="0.6"/>
    <circle cx="12" cy="0" r="1.5" fill="#ffd700" opacity="0.6"/>
  </g>

  <!-- Undangan text -->
  <text x="300" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#ffd700" opacity="0.7" letter-spacing="6">UNDANGAN PERNIKAHAN</text>

  <!-- Bismillah stylized -->
  <text x="300" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ffd700" opacity="0.55" font-style="italic">﷽</text>

  <!-- Horizontal divider line -->
  <line x1="200" y1="122" x2="400" y2="122" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>

  <!-- Couple names -->
  <text x="300" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="url(#gold)" filter="url(#glow)" font-style="italic">Siti</text>
  <text x="300" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd700" opacity="0.5" letter-spacing="4">&amp;</text>
  <text x="300" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="url(#gold)" filter="url(#glow)" font-style="italic">Ahmad</text>

  <!-- Middle ornament divider -->
  <g transform="translate(300,258)">
    <line x1="-70" y1="0" x2="-16" y2="0" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
    <line x1="16" y1="0" x2="70" y2="0" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
    <!-- Rose icon simplified -->
    <ellipse cx="0" cy="-5" rx="7" ry="5" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.7"/>
    <ellipse cx="-5" cy="0" rx="5" ry="7" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.7"/>
    <ellipse cx="5" cy="0" rx="5" ry="7" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="3" fill="#ffd700" opacity="0.5"/>
  </g>

  <!-- Date -->
  <text x="300" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ffd700" opacity="0.75" letter-spacing="2">Sabtu, 14 Februari 2026</text>

  <!-- Location -->
  <text x="300" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd700" opacity="0.5" letter-spacing="1">Gedung Serbaguna, Jakarta</text>

  <!-- Bottom divider -->
  <g transform="translate(300,342)">
    <line x1="-100" y1="0" x2="-20" y2="0" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="0" x2="100" y2="0" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#ffd700" opacity="0.5"/>
  </g>

  <!-- Bottom text -->
  <text x="300" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#ffd700" opacity="0.35" letter-spacing="5">NIKAHYUK · BY RATNA OFFSET</text>

  <!-- Subtle rose petals scattered -->
  <ellipse cx="95" cy="180" rx="18" ry="7" fill="#ffd700" opacity="0.04" transform="rotate(-30 95 180)"/>
  <ellipse cx="505" cy="220" rx="18" ry="7" fill="#ffd700" opacity="0.04" transform="rotate(30 505 220)"/>
  <ellipse cx="80" cy="280" rx="14" ry="5" fill="#ffd700" opacity="0.03" transform="rotate(15 80 280)"/>
  <ellipse cx="520" cy="140" rx="14" ry="5" fill="#ffd700" opacity="0.03" transform="rotate(-15 520 140)"/>
</svg>
