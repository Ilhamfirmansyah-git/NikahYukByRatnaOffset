  <!-- Divider -->
  <g transform="translate(300,262)">
    <line x1="-90" y1="0" x2="-18" y2="0" stroke="url(#gold)" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="0" x2="90" y2="0" stroke="url(#gold)" stroke-width="0.7" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c9a84c" opacity="0.75">&amp;</text>
  </g>

  <text x="300" y="292" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="url(#gold)" font-style="italic">Ahmad Fauzan</text>

  <!-- Date divider -->
  <g transform="translate(300,314)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#c9a84c" opacity="0.6"/>
  </g>

  <!-- Date & Location -->
  <text x="300" y="336" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#c9a84c" opacity="0.8" letter-spacing="2">Sabtu, 14 Februari 2026</text>
  <text x="300" y="354" text-anchor="middle" font-family="Georgia,serif" font-size="9.5" fill="#c9a84c" opacity="0.5" letter-spacing="1">Grand Ballroom, Jakarta</text>

  <!-- Watermark -->
  <text x="300" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="7.5" fill="#c9a84c" opacity="0.25" letter-spacing="5">NIKAHYUK · BY RATNA OFFSET</text>
</svg>
