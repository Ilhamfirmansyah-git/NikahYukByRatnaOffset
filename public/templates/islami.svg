    <polygon points="266,34 270,30 274,34 270,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="290,34 294,30 298,34 294,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="314,34 318,30 322,34 318,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="338,34 342,30 346,34 342,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="362,34 366,30 370,34 366,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="386,34 390,30 394,34 390,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="410,34 414,30 418,34 414,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="434,34 438,30 442,34 438,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="458,34 462,30 466,34 462,38" fill="#c9a84c" opacity="0.4"/>
    <polygon points="482,34 486,30 490,34 486,38" fill="#c9a84c" opacity="0.4"/>
