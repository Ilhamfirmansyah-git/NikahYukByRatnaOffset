    <polygon points="122,366 126,362 130,366 126,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="146,366 150,362 154,366 150,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="170,366 174,362 178,366 174,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="194,366 198,362 202,366 198,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="218,366 222,362 226,366 222,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="242,366 246,362 250,366 246,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="266,366 270,362 274,366 270,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="290,366 294,362 298,366 294,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="314,366 318,362 322,366 318,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="338,366 342,362 346,366 342,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="362,366 366,362 370,366 366,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="386,366 390,362 394,366 390,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="410,366 414,362 418,366 414,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="434,366 438,362 442,366 438,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="458,366 462,362 466,366 462,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="482,366 486,362 490,366 486,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="506,366 510,362 514,366 510,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="530,366 534,362 538,366 534,370" fill="#c9a84c" opacity="0.4"/>
    <polygon points="554,366 558,362 562,366 558,370" fill="#c9a84c" opacity="0.4"/>
