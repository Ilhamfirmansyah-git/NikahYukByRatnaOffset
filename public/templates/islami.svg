    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#gold)" stroke-width="0.7" opacity="0.45"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#gold)" stroke-width="0.7" opacity="0.45"/>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#c9a84c" opacity="0.8"/>
    <circle cx="-12" cy="0" r="1.5" fill="#c9a84c" opacity="0.5"/>
    <circle cx="12" cy="0" r="1.5" fill="#c9a84c" opacity="0.5"/>
  </g>

  <!-- Islamic star / geometric medallion center -->
  <g transform="translate(300,160)" opacity="0.85">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="48" fill="#0f2d1f" stroke="url(#gold)" stroke-width="1.2" opacity="0.7"/>
    <!-- 8-pointed star -->
    <polygon points="0,-36 8,-8 36,0 8,8 0,36 -8,8 -36,0 -8,-8" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
    <polygon points="0,-36 8,-8 36,0 8,8 0,36 -8,8 -36,0 -8,-8" fill="#c9a84c" opacity="0.08" transform="rotate(22.5)"/>
    <polygon points="0,-36 8,-8 36,0 8,8 0,36 -8,8 -36,0 -8,-8" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.4" transform="rotate(22.5)"/>
    <!-- Inner star smaller -->
    <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="#c9a84c" opacity="0.2"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="#c9a84c" opacity="0.6"/>
    <!-- Dot accents -->
    <circle cx="0" cy="-48" r="2" fill="#c9a84c" opacity="0.5"/>
    <circle cx="0" cy="48" r="2" fill="#c9a84c" opacity="0.5"/>
    <circle cx="-48" cy="0" r="2" fill="#c9a84c" opacity="0.5"/>
    <circle cx="48" cy="0" r="2" fill="#c9a84c" opacity="0.5"/>
  </g>

  <!-- Couple names -->
