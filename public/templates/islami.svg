    <line x1="0" y1="0" x2="0" y2="50" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#F0D080" opacity="0.9"/>
  </g>
  <!-- Corner ornaments BR -->
  <g transform="translate(582,382) scale(-1,-1)" opacity="0.85">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#F0D080" opacity="0.9"/>
