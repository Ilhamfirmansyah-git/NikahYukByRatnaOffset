<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f5"/>
      <stop offset="50%" style="stop-color:#fce8ef"/>
      <stop offset="100%" style="stop-color:#faf0f3"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c96b8a"/>
      <stop offset="100%" style="stop-color:#e8a4be"/>
    </linearGradient>
    <linearGradient id="roseLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8a4be"/>
      <stop offset="50%" style="stop-color:#f5c6d8"/>
      <stop offset="100%" style="stop-color:#e8a4be"/>
    </linearGradient>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f5c6d8"/>
      <stop offset="100%" style="stop-color:#e8a4be"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Subtle pink vignette corners -->
  <ellipse cx="0" cy="0" rx="200" ry="200" fill="#e8a4be" opacity="0.07"/>
  <ellipse cx="600" cy="0" rx="200" ry="200" fill="#e8a4be" opacity="0.07"/>
  <ellipse cx="0" cy="400" rx="200" ry="200" fill="#e8a4be" opacity="0.07"/>
  <ellipse cx="600" cy="400" rx="200" ry="200" fill="#e8a4be" opacity="0.07"/>

  <!-- Outer border -->
  <rect x="12" y="12" width="576" height="376" fill="none" stroke="#e8a4be" stroke-width="1.5" opacity="0.6"/>
  <rect x="18" y="18" width="564" height="364" fill="none" stroke="#f5c6d8" stroke-width="0.5" opacity="0.5"/>

  <!-- Corner floral motif TL -->
  <g transform="translate(20,20)" opacity="0.75">
    <!-- Petal cluster -->
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(15)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(60)"/>
    <circle cx="0" cy="0" r="4" fill="#c96b8a" opacity="0.6"/>
    <line x1="8" y1="0" x2="45" y2="0" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="45" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
    <!-- Small dots -->
    <circle cx="20" cy="5" r="1.5" fill="#c96b8a" opacity="0.4"/>
    <circle cx="5" cy="20" r="1.5" fill="#c96b8a" opacity="0.4"/>
  </g>

  <!-- Corner floral motif TR -->
  <g transform="translate(580,20) scale(-1,1)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(15)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(60)"/>
    <circle cx="0" cy="0" r="4" fill="#c96b8a" opacity="0.6"/>
    <line x1="8" y1="0" x2="45" y2="0" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="45" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
    <circle cx="20" cy="5" r="1.5" fill="#c96b8a" opacity="0.4"/>
    <circle cx="5" cy="20" r="1.5" fill="#c96b8a" opacity="0.4"/>
  </g>

  <!-- Corner floral motif BL -->
  <g transform="translate(20,380) scale(1,-1)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(15)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(60)"/>
    <circle cx="0" cy="0" r="4" fill="#c96b8a" opacity="0.6"/>
    <line x1="8" y1="0" x2="45" y2="0" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="45" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Corner floral motif BR -->
  <g transform="translate(580,380) scale(-1,-1)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(15)"/>
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#petalGrad)" opacity="0.55" transform="rotate(60)"/>
    <circle cx="0" cy="0" r="4" fill="#c96b8a" opacity="0.6"/>
    <line x1="8" y1="0" x2="45" y2="0" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="45" stroke="#e8a4be" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Scattered rose petals - left side -->
  <g opacity="0.3">
    <ellipse cx="60" cy="150" rx="18" ry="9" fill="#e8a4be" transform="rotate(-20 60 150)"/>
    <ellipse cx="48" cy="180" rx="14" ry="7" fill="#f5c6d8" transform="rotate(10 48 180)"/>
    <ellipse cx="72" cy="220" rx="16" ry="8" fill="#e8a4be" transform="rotate(-35 72 220)"/>
    <ellipse cx="42" cy="250" rx="12" ry="6" fill="#f5c6d8" transform="rotate(15 42 250)"/>
  </g>

  <!-- Scattered rose petals - right side -->
  <g opacity="0.3">
    <ellipse cx="540" cy="140" rx="18" ry="9" fill="#e8a4be" transform="rotate(20 540 140)"/>
    <ellipse cx="552" cy="175" rx="14" ry="7" fill="#f5c6d8" transform="rotate(-10 552 175)"/>
    <ellipse cx="528" cy="215" rx="16" ry="8" fill="#e8a4be" transform="rotate(35 528 215)"/>
    <ellipse cx="558" cy="248" rx="12" ry="6" fill="#f5c6d8" transform="rotate(-15 558 248)"/>
  </g>

  <!-- Top label -->
  <text x="300" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#c96b8a" letter-spacing="7" opacity="0.7">UNDANGAN PERNIKAHAN</text>

  <!-- Top decorative divider -->
  <g transform="translate(300,62)">
    <line x1="-100" y1="0" x2="-20" y2="0" stroke="url(#roseLight)" stroke-width="0.8" opacity="0.6"/>
    <line x1="20" y1="0" x2="100" y2="0" stroke="url(#roseLight)" stroke-width="0.8" opacity="0.6"/>
    <!-- Small flower -->
    <circle cx="0" cy="0" r="5" fill="#f5c6d8" opacity="0.7"/>
    <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#e8a4be" opacity="0.6"/>
    <ellipse cx="0" cy="7" rx="3" ry="5" fill="#e8a4be" opacity="0.6"/>
    <ellipse cx="-7" cy="0" rx="5" ry="3" fill="#e8a4be" opacity="0.6"/>
    <ellipse cx="7" cy="0" rx="5" ry="3" fill="#e8a4be" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="#c96b8a" opacity="0.7"/>
    <circle cx="-14" cy="0" r="1.5" fill="#e8a4be" opacity="0.5"/>
    <circle cx="14" cy="0" r="1.5" fill="#e8a4be" opacity="0.5"/>
  </g>

  <!-- Rose bouquet top center (simplified) -->
  <g transform="translate(300,130)" opacity="0.6">
    <!-- Leaves -->
    <ellipse cx="-22" cy="8" rx="15" ry="6" fill="#4a7c59" opacity="0.35" transform="rotate(-35 -22 8)"/>
    <ellipse cx="22" cy="8" rx="15" ry="6" fill="#4a7c59" opacity="0.35" transform="rotate(35 22 8)"/>
    <!-- Main rose -->
    <circle cx="0" cy="-8" r="18" fill="#e8a4be" opacity="0.5"/>
    <circle cx="0" cy="-8" r="13" fill="#dc8ca8" opacity="0.5"/>
    <circle cx="0" cy="-8" r="8" fill="#c96b8a" opacity="0.5"/>
    <circle cx="0" cy="-8" r="4" fill="#b85580" opacity="0.6"/>
    <!-- Petals around main rose -->
    <ellipse cx="-14" cy="-8" rx="10" ry="6" fill="#e8a4be" opacity="0.45" transform="rotate(-10 -14 -8)"/>
    <ellipse cx="14" cy="-8" rx="10" ry="6" fill="#e8a4be" opacity="0.45" transform="rotate(10 14 -8)"/>
    <ellipse cx="0" cy="-22" rx="6" ry="10" fill="#e8a4be" opacity="0.45"/>
  </g>

  <!-- Couple names -->
  <text x="300" y="192" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#8b3d5a" font-style="italic" font-weight="400">Siti</text>

  <!-- Ampersand divider -->
  <g transform="translate(300,212)">
    <line x1="-90" y1="0" x2="-16" y2="0" stroke="#e8a4be" stroke-width="0.8" opacity="0.6"/>
    <line x1="16" y1="0" x2="90" y2="0" stroke="#e8a4be" stroke-width="0.8" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c96b8a" opacity="0.75">&amp;</text>
  </g>

  <text x="300" y="252" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#8b3d5a" font-style="italic" font-weight="400">Ahmad</text>

  <!-- Date divider -->
  <g transform="translate(300,276)">
    <line x1="-110" y1="0" x2="-16" y2="0" stroke="#e8a4be" stroke-width="0.8" opacity="0.5"/>
    <line x1="16" y1="0" x2="110" y2="0" stroke="#e8a4be" stroke-width="0.8" opacity="0.5"/>
    <!-- Small flower center -->
    <ellipse cx="0" cy="-4" rx="3" ry="4.5" fill="#f5c6d8" opacity="0.7"/>
    <ellipse cx="0" cy="4" rx="3" ry="4.5" fill="#f5c6d8" opacity="0.7"/>
    <ellipse cx="-4" cy="0" rx="4.5" ry="3" fill="#f5c6d8" opacity="0.7"/>
    <ellipse cx="4" cy="0" rx="4.5" ry="3" fill="#f5c6d8" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#c96b8a" opacity="0.7"/>
  </g>

  <!-- Date -->
  <text x="300" y="302" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a0526e" letter-spacing="2" opacity="0.8">SABTU, 14 FEBRUARI 2026</text>

  <!-- Location -->
  <line x1="210" y1="318" x2="390" y2="318" stroke="#f5c6d8" stroke-width="0.5" opacity="0.7"/>
  <text x="300" y="336" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#c96b8a" letter-spacing="1" opacity="0.65">Grand Ballroom · Jakarta</text>

  <!-- Bottom small flower row -->
  <g transform="translate(300,355)" opacity="0.4">
    <circle cx="-20" cy="0" r="3" fill="#f5c6d8"/>
    <circle cx="-12" cy="0" r="2" fill="#e8a4be"/>
    <circle cx="0" cy="0" r="4" fill="#c96b8a"/>
    <circle cx="12" cy="0" r="2" fill="#e8a4be"/>
    <circle cx="20" cy="0" r="3" fill="#f5c6d8"/>
  </g>

  <!-- Watermark -->
  <text x="300" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#c96b8a" opacity="0.2" letter-spacing="5">NIKAHYUK · BY RATNA OFFSET</text>
</svg>
