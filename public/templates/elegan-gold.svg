<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0805"/>
      <stop offset="50%" style="stop-color:#150E07"/>
      <stop offset="100%" style="stop-color:#0A0805"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="40%" style="stop-color:#C9A84C"/>
      <stop offset="60%" style="stop-color:#F0D080"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#F0D080"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a1f08"/>
      <stop offset="100%" style="stop-color:#0A0805"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Subtle texture overlay -->
  <rect width="600" height="400" fill="#C9A84C" opacity="0.02"/>

  <!-- Outer decorative border -->
  <rect x="10" y="10" width="580" height="380" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.25"/>

  <!-- Corner ornaments - Top Left -->
  <g transform="translate(18,18)" opacity="0.9">
    <line x1="0" y1="0" x2="55" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="55" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#F0D080" opacity="0.9"/>
    <!-- Leaf motif -->
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(45 20 20)" opacity="0.6"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(-45 20 20)" opacity="0.6"/>
    <circle cx="20" cy="20" r="2.5" fill="#C9A84C" opacity="0.5"/>
    <!-- Tiny diamond -->
    <polygon points="28,0 32,4 28,8 24,4" fill="#F0D080" opacity="0.6"/>
    <polygon points="0,28 4,32 0,36 -4,32" fill="#F0D080" opacity="0.6" transform="translate(0,0)"/>
  </g>

  <!-- Corner ornaments - Top Right -->
  <g transform="translate(582,18) scale(-1,1)" opacity="0.9">
    <line x1="0" y1="0" x2="55" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="55" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#F0D080" opacity="0.9"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(45 20 20)" opacity="0.6"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(-45 20 20)" opacity="0.6"/>
    <circle cx="20" cy="20" r="2.5" fill="#C9A84C" opacity="0.5"/>
    <polygon points="28,0 32,4 28,8 24,4" fill="#F0D080" opacity="0.6"/>
  </g>

  <!-- Corner ornaments - Bottom Left -->
  <g transform="translate(18,382) scale(1,-1)" opacity="0.9">
    <line x1="0" y1="0" x2="55" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="55" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#F0D080" opacity="0.9"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(45 20 20)" opacity="0.6"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(-45 20 20)" opacity="0.6"/>
    <circle cx="20" cy="20" r="2.5" fill="#C9A84C" opacity="0.5"/>
    <polygon points="28,0 32,4 28,8 24,4" fill="#F0D080" opacity="0.6"/>
  </g>

  <!-- Corner ornaments - Bottom Right -->
  <g transform="translate(582,382) scale(-1,-1)" opacity="0.9">
    <line x1="0" y1="0" x2="55" y2="0" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="55" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#F0D080" opacity="0.9"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(45 20 20)" opacity="0.6"/>
    <ellipse cx="20" cy="20" rx="14" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" transform="rotate(-45 20 20)" opacity="0.6"/>
    <circle cx="20" cy="20" r="2.5" fill="#C9A84C" opacity="0.5"/>
    <polygon points="28,0 32,4 28,8 24,4" fill="#F0D080" opacity="0.6"/>
  </g>

  <!-- Top label -->
  <text x="300" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#C9A84C" opacity="0.7" letter-spacing="8">THE WEDDING OF</text>

  <!-- Top divider -->
  <g transform="translate(300,60)">
    <line x1="-100" y1="0" x2="-22" y2="0" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="0" x2="100" y2="0" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#C9A84C" opacity="0.8"/>
    <circle cx="-14" cy="0" r="1.5" fill="#C9A84C" opacity="0.5"/>
    <circle cx="14" cy="0" r="1.5" fill="#C9A84C" opacity="0.5"/>
  </g>

  <!-- Circular portrait frame -->
  <circle cx="300" cy="140" r="52" fill="url(#circleGrad)" stroke="url(#gold)" stroke-width="1.5" opacity="0.9"/>
  <circle cx="300" cy="140" r="46" fill="none" stroke="#C9A84C" stroke-width="0.6" opacity="0.4"/>
  <!-- Frame decorative dots -->
  <circle cx="300" cy="88" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="300" cy="192" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="248" cy="140" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <circle cx="352" cy="140" r="2.5" fill="#C9A84C" opacity="0.7"/>
  <!-- Initials inside circle -->
  <text x="300" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="url(#gold)" font-style="italic" filter="url(#glow)">S &amp; A</text>

  <!-- Couple names -->
  <text x="300" y="232" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="url(#gold)" filter="url(#glow)" font-style="italic">Siti Nurhaliza</text>

  <!-- Ampersand divider -->
  <g transform="translate(300,252)">
    <line x1="-80" y1="0" x2="-18" y2="0" stroke="url(#gold)" stroke-width="0.7" opacity="0.5"/>
    <line x1="18" y1="0" x2="80" y2="0" stroke="url(#gold)" stroke-width="0.7" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#C9A84C" opacity="0.7">&amp;</text>
  </g>

  <text x="300" y="280" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="url(#gold)" filter="url(#glow)" font-style="italic">Ahmad Fauzan</text>

  <!-- Date divider -->
  <g transform="translate(300,305)">
    <line x1="-110" y1="0" x2="-20" y2="0" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>
    <line x1="20" y1="0" x2="110" y2="0" stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>
    <ellipse cx="0" cy="-3" rx="8" ry="5" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="-6" cy="1" rx="5" ry="7" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="6" cy="1" rx="5" ry="7" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="#C9A84C" opacity="0.5"/>
  </g>

  <!-- Date & location -->
  <text x="300" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#C9A84C" opacity="0.8" letter-spacing="2">Sabtu, 14 Februari 2026</text>
  <text x="300" y="352" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#C9A84C" opacity="0.5" letter-spacing="1">Grand Ballroom, Jakarta</text>

  <!-- Bottom watermark -->
  <text x="300" y="382" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#C9A84C" opacity="0.3" letter-spacing="5">NIKAHYUK · BY RATNA OFFSET</text>
</svg>
