<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F9FAFB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Outer thin border -->
  <rect x="24" y="24" width="552" height="352" fill="none" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Inner thin border -->
  <rect x="32" y="32" width="536" height="336" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>

  <!-- Top horizontal accent -->
  <line x1="160" y1="62" x2="440" y2="62" stroke="#374151" stroke-width="0.8" opacity="0.25"/>

  <!-- "UNDANGAN PERNIKAHAN" label -->
  <text x="300" y="88" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6B7280" letter-spacing="8" font-weight="300">UNDANGAN PERNIKAHAN</text>

  <!-- Thin line under label -->
  <line x1="220" y1="98" x2="380" y2="98" stroke="#D1D5DB" stroke-width="0.5"/>

  <!-- Couple names -->
  <text x="300" y="158" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="42" fill="#374151" font-weight="400" font-style="italic">Siti</text>

  <!-- Small ampersand -->
  <text x="300" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#9CA3AF" letter-spacing="4" font-weight="300">—  &amp;  —</text>

  <text x="300" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="42" fill="#374151" font-weight="400" font-style="italic">Ahmad</text>

  <!-- Divider dots -->
  <g transform="translate(300,262)">
    <circle cx="-8" cy="0" r="1.5" fill="#D1D5DB"/>
    <circle cx="0" cy="0" r="2" fill="#9CA3AF"/>
    <circle cx="8" cy="0" r="1.5" fill="#D1D5DB"/>
  </g>

  <!-- Date -->
  <text x="300" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B7280" letter-spacing="3" font-weight="300">SABTU, 14 FEBRUARI 2026</text>

  <!-- Location -->
  <line x1="220" y1="310" x2="380" y2="310" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="300" y="330" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9CA3AF" letter-spacing="1" font-weight="300">Grand Ballroom · Jakarta</text>

  <!-- Bottom accent line -->
  <line x1="160" y1="352" x2="440" y2="352" stroke="#D1D5DB" stroke-width="0.8" opacity="0.5"/>

  <!-- Corner small marks -->
  <line x1="33" y1="33" x2="50" y2="33" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="33" y1="33" x2="33" y2="50" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="567" y1="33" x2="550" y2="33" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="567" y1="33" x2="567" y2="50" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="33" y1="367" x2="50" y2="367" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="33" y1="367" x2="33" y2="350" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="567" y1="367" x2="550" y2="367" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="567" y1="367" x2="567" y2="350" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Watermark -->
  <text x="300" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#D1D5DB" letter-spacing="5">NIKAHYUK · BY RATNA OFFSET</text>
</svg>
